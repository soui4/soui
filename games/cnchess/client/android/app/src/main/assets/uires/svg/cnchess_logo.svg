<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
    <!-- 背景圆形渐变装饰 -->
    <defs>
        <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="pieceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8B0000"/>
            <stop offset="50%" stop-color="#DC143C"/>
            <stop offset="100%" stop-color="#B22222"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>
    
    <!-- 背景装饰圆 -->
    <circle cx="150" cy="60" r="55" fill="url(#bgGradient)"/>
    
    <!-- 象棋棋子 - 将/帅 -->
    <g filter="url(#shadow)">
        <!-- 棋子外圈 -->
        <circle cx="80" cy="60" r="42" fill="url(#pieceGradient)" stroke="#FFD700" stroke-width="3"/>
        <!-- 棋子内圈 -->
        <circle cx="80" cy="60" r="34" fill="none" stroke="#FFD700" stroke-width="1.5"/>
        <!-- 棋子中心装饰 -->
        <circle cx="80" cy="60" r="28" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.5"/>
        
        <!-- 文字 "帅" 的简化图形 -->
        <g fill="#FFD700" stroke="#8B0000" stroke-width="0.5">
            <!-- 中心十字 -->
            <rect x="78" y="38" width="4" height="44" rx="1"/>
            <rect x="58" y="58" width="44" height="4" rx="1"/>
            <!-- 顶部装饰 -->
            <circle cx="80" cy="45" r="6" fill="#FFD700"/>
            <!-- 底部装饰 -->
            <path d="M65,75 Q80,90 95,75" stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
    </g>
    
    <!-- 标题文字装饰线 -->
    <line x1="135" y1="45" x2="145" y2="45" stroke="#FFD700" stroke-width="2"/>
    <line x1="135" y1="75" x2="145" y2="75" stroke="#FFD700" stroke-width="2"/>
    
    <!-- 标题文字 (使用图形代替文字) -->
    <g transform="translate(165, 35)">
        <!-- 中 -->
        <g fill="#FFD700" stroke="#8B0000" stroke-width="0.3">
            <rect x="0" y="0" width="20" height="40" rx="2" fill="#DC143C"/>
            <rect x="3" y="8" width="14" height="24" rx="1" fill="#FFF8DC" opacity="0.9"/>
            <line x1="10" y1="8" x2="10" y2="32" stroke="#DC143C" stroke-width="2"/>
            <line x1="3" y1="20" x2="17" y2="20" stroke="#DC143C" stroke-width="2"/>
        </g>
        
        <!-- 国 -->
        <g transform="translate(30, 0)">
            <rect x="0" y="0" width="20" height="40" rx="2" fill="#DC143C"/>
            <rect x="3" y="5" width="14" height="30" rx="1" fill="#FFF8DC" opacity="0.9"/>
            <rect x="6" y="8" width="8" height="8" rx="1" fill="#DC143C"/>
            <line x1="4" y1="20" x2="16" y2="20" stroke="#DC143C" stroke-width="1.5"/>
            <rect x="4" y="24" width="12" height="2" fill="#DC143C"/>
        </g>
        
        <!-- 象 -->
        <g transform="translate(60, 0)">
            <rect x="0" y="0" width="20" height="40" rx="2" fill="#DC143C"/>
            <rect x="3" y="5" width="14" height="30" rx="1" fill="#FFF8DC" opacity="0.9"/>
            <!-- 象形符号 -->
            <circle cx="10" cy="15" r="5" fill="none" stroke="#DC143C" stroke-width="1.5"/>
            <line x1="10" y1="20" x2="10" y2="32" stroke="#DC143C" stroke-width="2"/>
            <line x1="4" y1="28" x2="16" y2="28" stroke="#DC143C" stroke-width="1.5"/>
        </g>
        
        <!-- 棋 -->
        <g transform="translate(90, 0)">
            <rect x="0" y="0" width="20" height="40" rx="2" fill="#DC143C"/>
            <rect x="3" y="5" width="14" height="30" rx="1" fill="#FFF8DC" opacity="0.9"/>
            <!-- 棋盘格符号 -->
            <line x1="4" y1="10" x2="16" y2="10" stroke="#DC143C" stroke-width="1"/>
            <line x1="4" y1="18" x2="16" y2="18" stroke="#DC143C" stroke-width="1"/>
            <line x1="4" y1="26" x2="16" y2="26" stroke="#DC143C" stroke-width="1"/>
            <line x1="10" y1="8" x2="10" y2="30" stroke="#DC143C" stroke-width="1"/>
        </g>
    </g>
    
    <!-- 副标题装饰 -->
    <g transform="translate(165, 85)" opacity="0.8">
        <rect x="0" y="0" width="80" height="3" rx="1" fill="#FFD700"/>
        <rect x="5" y="6" width="70" height="2" rx="0.5" fill="#FFD700" opacity="0.6"/>
    </g>
</svg>
