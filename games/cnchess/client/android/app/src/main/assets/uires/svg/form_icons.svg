<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="24" viewBox="0 0 72 24">
    <!-- State 0: Server Icon (0,0 - 24,24) -->
    <g transform="translate(0,0)" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- 服务器主体 -->
        <rect x="5" y="3" width="14" height="6" rx="1" ry="1" fill="#3D2F1F"/>
        <rect x="5" y="10" width="14" height="6" rx="1" ry="1" fill="#3D2F1F"/>
        <rect x="5" y="17" width="14" height="5" rx="1" ry="1" fill="#3D2F1F"/>
        <!-- 指示灯 -->
        <circle cx="7" cy="6" r="0.8" fill="#FFD700" stroke="none"/>
        <circle cx="7" cy="13" r="0.8" fill="#FFD700" stroke="none"/>
        <circle cx="7" cy="19.5" r="0.8" fill="#FFD700" stroke="none"/>
        <!-- 网络连接线 -->
        <line x1="12" y1="22" x2="12" y2="14" stroke="#8B7355" stroke-width="1"/>
        <path d="M8,14 L12,10 L16,14" stroke="#8B7355" stroke-width="0.8" fill="none"/>
    </g>
    
    <!-- State 1: User Icon (24,0 - 48,24) -->
    <g transform="translate(24,0)" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- 头部 -->
        <circle cx="12" cy="7" r="4" fill="#3D2F1F"/>
        <!-- 身体 -->
        <path d="M4,21 Q4,13 12,13 Q20,13 20,21" fill="#3D2F1F"/>
        <!-- 装饰: 衣领 -->
        <path d="M8,15 L12,18 L16,15" stroke="#FFD700" stroke-width="0.8" fill="none"/>
    </g>
    
    <!-- State 2: Gender Icon (48,0 - 72,24) -->
    <g transform="translate(48,0)" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- 男性符号: 圆圈 + 箭头 -->
        <circle cx="8" cy="16" r="5" fill="#3D2F1F"/>
        <circle cx="8" cy="16" r="2" stroke="#FFD700" stroke-width="0.8" fill="none"/>
        <line x1="12" y1="12" x2="20" y2="4" stroke="#FFD700" stroke-width="1.5"/>
        <line x1="15" y1="4" x2="20" y2="4" stroke="#FFD700" stroke-width="1.5"/>
        <line x1="20" y1="4" x2="20" y2="9" stroke="#FFD700" stroke-width="1.5"/>
        <!-- 分隔虚线（视觉提示） -->
        <line x1="24" y1="2" x2="24" y2="22" stroke="#8B7355" stroke-width="0.3" stroke-dasharray="1,1"/>
    </g>
</svg>
