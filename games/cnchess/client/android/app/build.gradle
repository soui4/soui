plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soui.cnchess'
    compileSdk 34

    defaultConfig {
        applicationId "com.soui.cnchess"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                // soui-android-lib 现在只提供 Java 壳与 native 源码，
                // native 由本 app 通过 soui4_android.cmake 统一编译（见 app/src/main/cpp/CMakeLists.txt），
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared",
                        "-DSOUI_ROOT_DIR=${rootDir.absolutePath.replace('\\', '/')}/../../../../",
                        "-DSOUI_ANDROID_LIB_CPP_DIR=${project(':soui-android-lib').projectDir.absolutePath.replace('\\', '/')}/src/main/cpp",
                        "-DSOUI_CONTROLS_EXTEND_DIR=${rootDir.absolutePath.replace('\\', '/')}/../../../../controls.extend",
                        "-DCNCHESS_CLIENT_DIR=${rootDir.absolutePath.replace('\\', '/')}/..",
                        "-DCNCHESS_ROOT_DIR=${rootDir.absolutePath.replace('\\', '/')}/../.."
            }
        }
        ndk {
            abiFilters 'x86', 'arm64-v8a', 'x86_64', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug

        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 引用 soui-android-lib 模块
    implementation project(':soui-android-lib')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
