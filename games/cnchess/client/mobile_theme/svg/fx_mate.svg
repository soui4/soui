    <radialGradient id="redGlow" cx="130" cy="68" r="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C0392B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C0392B" stop-opacity="0"/>
