    <path d="M202,68 L220,68"/>
    <path d="M74,106 L60,120"/>
    <path d="M186,106 L200,120"/>
  </g>

  <!-- shattered piece, two halves with jagged crack -->
  <path d="M130,20 A48,48 0 0 0 82,68 A48,48 0 0 0 130,116 L126,96 L138,80 L124,64 L136,48 L128,32 Z" fill="url(#piece)" stroke="url(#rim)" stroke-width="4"/>
  <path d="M130,20 A48,48 0 0 1 178,68 A48,48 0 0 1 130,116 L134,94 L120,78 L134,62 L122,46 L132,30 Z" fill="url(#piece)" stroke="url(#rim)" stroke-width="4"/>

  <!-- red X seal -->
  <g stroke="#C0392B" stroke-width="7" stroke-linecap="round">
    <path d="M158,24 L186,46"/>
    <path d="M186,24 L158,46"/>
