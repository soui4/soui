<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 140" width="260" height="140">
  <defs>
    <radialGradient id="piece" cx="130" cy="68" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A3A1A"/>
      <stop offset="0.65" stop-color="#3B2412"/>
      <stop offset="1" stop-color="#221408"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
