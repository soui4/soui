  <circle cx="130" cy="68" r="66" fill="url(#redGlow)"/>

  <!-- shatter rays -->
  <g stroke="#E8B04B" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M74,30 L60,16"/>
    <path d="M186,30 L200,16"/>
