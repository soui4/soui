<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="168" height="28" viewBox="0 0 168 28">
  <defs>
    <!-- 金色系背景渐变 (呼应木纹+金色主题) -->
    <linearGradient id="bgN" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C65A"/><stop offset="48%" stop-color="#E5AE3B"/><stop offset="100%" stop-color="#C68F1E"/>
    </linearGradient>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8D87E"/><stop offset="48%" stop-color="#EDBB4B"/><stop offset="100%" stop-color="#D19E2A"/>
    </linearGradient>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A97D18"/><stop offset="48%" stop-color="#967010"/><stop offset="100%" stop-color="#7C5A0C"/>
    </linearGradient>
    <!-- 邀请加号徽章: 米白高光 -->
    <radialGradient id="badge" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F3E3B4"/>
    </radialGradient>
  </defs>

  <!-- State 1: Normal (邀请机器人: 金色 + 加号徽章) -->
  <g>
    <rect x="0.75" y="0.75" width="54.5" height="26.5" rx="13" fill="url(#bgN)" stroke="#8F6810" stroke-width="1.5"/>
    <!-- 机器人头 -->
    <rect x="8" y="8" width="16" height="13" rx="3.5" fill="#FFF9E8" opacity="0.95" stroke="#6B4E16" stroke-width="1.2"/>
    <line x1="11" y1="9" x2="10" y2="4.8" stroke="#6B4E16" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="21" y1="9" x2="22" y2="4.8" stroke="#6B4E16" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="10" cy="4.6" r="1.4" fill="#B8860B"/>
    <circle cx="22" cy="4.6" r="1.4" fill="#B8860B"/>
    <circle cx="13" cy="14" r="1.9" fill="#4A340E"/>
    <circle cx="19" cy="14" r="1.9" fill="#4A340E"/>
    <path d="M15,17.5 q2,1.8 4.8,0" stroke="#6B4E16" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- 邀请加号徽章 -->
    <circle cx="45" cy="14" r="6" fill="url(#badge)" stroke="#8F6810" stroke-width="1.2"/>
    <rect x="42.8" y="13.1" width="4.4" height="1.8" rx="0.9" fill="#8F6810"/>
    <rect x="44.1" y="11.8" width="1.8" height="4.4" rx="0.9" fill="#8F6810"/>
  </g>

  <!-- State 2: Hover -->
  <g transform="translate(56,0)">
    <rect x="0.75" y="0.75" width="54.5" height="26.5" rx="13" fill="url(#bgH)" stroke="#8F6810" stroke-width="1.5"/>
    <rect x="0.75" y="0.75" width="54.5" height="26.5" rx="13" fill="none" stroke="#FFD700" stroke-opacity="0.9" stroke-width="1.5"/>
    <rect x="8" y="8" width="16" height="13" rx="3.5" fill="#FFFFFF" opacity="0.97" stroke="#6B4E16" stroke-width="1.2"/>
    <line x1="11" y1="9" x2="10" y2="4.8" stroke="#6B4E16" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="21" y1="9" x2="22" y2="4.8" stroke="#6B4E16" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="10" cy="4.6" r="1.4" fill="#B8860B"/>
    <circle cx="22" cy="4.6" r="1.4" fill="#B8860B"/>
    <circle cx="13" cy="14" r="1.9" fill="#4A340E"/>
    <circle cx="19" cy="14" r="1.9" fill="#4A340E"/>
    <path d="M15,17.5 q2,1.8 4.8,0" stroke="#6B4E16" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="14" r="6" fill="url(#badge)" stroke="#8F6810" stroke-width="1.2"/>
    <rect x="42.8" y="13.1" width="4.4" height="1.8" rx="0.9" fill="#8F6810"/>
    <rect x="44.1" y="11.8" width="1.8" height="4.4" rx="0.9" fill="#8F6810"/>
  </g>

  <!-- State 3: Pressed (下沉1px) -->
  <g transform="translate(112,1)">
    <rect x="0.75" y="0.75" width="54.5" height="26.5" rx="13" fill="url(#bgP)" stroke="#5E4408" stroke-width="1.5"/>
    <rect x="8" y="8" width="16" height="13" rx="3.5" fill="#F3E9CC" opacity="0.97" stroke="#4A340E" stroke-width="1.2"/>
    <line x1="11" y1="9" x2="10" y2="4.8" stroke="#4A340E" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="21" y1="9" x2="22" y2="4.8" stroke="#4A340E" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="10" cy="4.6" r="1.4" fill="#8F6810"/>
    <circle cx="22" cy="4.6" r="1.4" fill="#8F6810"/>
    <circle cx="13" cy="14" r="1.9" fill="#35260A"/>
    <circle cx="19" cy="14" r="1.9" fill="#35260A"/>
    <path d="M15,17.5 q2,1.8 4.8,0" stroke="#4A340E" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="14" r="6" fill="#EDDFAE" stroke="#4A340E" stroke-width="1.2"/>
    <rect x="42.8" y="13.1" width="4.4" height="1.8" rx="0.9" fill="#35260A"/>
    <rect x="44.1" y="11.8" width="1.8" height="4.4" rx="0.9" fill="#35260A"/>
  </g>
</svg>