<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" viewBox="0 0 112 20">
  <!-- 最大化按钮 4态 (28x20) 金色主题 -->
  <defs>
    <rect id="under" x="0.5" y="0.5" width="27" height="19" rx="4" ry="4"/>
    <g id="glyph">
      <rect x="8" y="6" width="12" height="9" rx="1" ry="1" fill="none" stroke="#DAA520" stroke-width="1.6"/>
      <path d="M8 9 L8 6.5 L16.5 6.5" fill="none" stroke="#DAA520" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- 态1 Normal -->
  <use href="#under" fill="rgba(0,0,0,0)" stroke="#5D4E37" stroke-width="1"/>
  <use href="#glyph" opacity="0.6"/>

  <!-- 态2 Hover -->
  <use href="#under" x="28" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
  <g transform="translate(28,0)"><g transform="translate(0,0)"><rect x="8" y="6" width="12" height="9" rx="1" ry="1" fill="none" stroke="#2A1810" stroke-width="1.6"/><path d="M8 9 L8 6.5 L16.5 6.5" fill="none" stroke="#2A1810" stroke-width="1.2"/></g></g>

  <!-- 态3 Pressed -->
  <use href="#under" x="56" fill="#B8860B" stroke="#8B6B1F" stroke-width="1"/>
  <g transform="translate(56,0)"><g transform="translate(0,0)"><rect x="8" y="6" width="12" height="9" rx="1" ry="1" fill="none" stroke="#1E0F07" stroke-width="1.6"/><path d="M8 9 L8 6.5 L16.5 6.5" fill="none" stroke="#1E0F07" stroke-width="1.2"/></g></g>

  <!-- 态4 Disabled -->
  <use href="#under" x="84" fill="rgba(0,0,0,0)" stroke="#5D4E37" stroke-width="1" opacity="0.5"/>
  <g transform="translate(84,0)"><g transform="translate(0,0)"><rect x="8" y="6" width="12" height="9" rx="1" ry="1" fill="none" stroke="#5D4E37" stroke-width="1.6" opacity="0.5"/><path d="M8 9 L8 6.5 L16.5 6.5" fill="none" stroke="#5D4E37" stroke-width="1.2" opacity="0.5"/></g></g>
</svg>