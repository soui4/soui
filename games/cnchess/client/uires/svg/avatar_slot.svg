<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="56" viewBox="0 0 224 56">
  <defs>
    <radialGradient id="slotBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4a3723"/>
      <stop offset="100%" stop-color="#2b1e11"/>
    </radialGradient>
  </defs>
  <!-- State 1: Normal (0 - 56) 圆形底+棕边 -->
  <g>
    <circle cx="28" cy="28" r="26.5" fill="url(#slotBg)" stroke="#5d4e37" stroke-width="2"/>
  </g>
  <!-- State 2: Hover (56 - 112) 金边 -->
  <g transform="translate(56,0)">
    <circle cx="28" cy="28" r="26.5" fill="url(#slotBg)" stroke="#ffd700" stroke-width="2.2"/>
    <circle cx="28" cy="28" r="22" fill="none" stroke="#ffd700" stroke-width="0.6" opacity="0.5"/>
  </g>
  <!-- State 3: Selected (112 - 168) 金边+右下金色选中点 -->
  <g transform="translate(112,0)">
    <circle cx="28" cy="28" r="26.5" fill="url(#slotBg)" stroke="#ffd700" stroke-width="2.4"/>
    <circle cx="28" cy="28" r="22" fill="none" stroke="#ffd700" stroke-width="0.6" opacity="0.55"/>
    <!-- 右下选中指示器:金色外圈+深色内芯 -->
    <circle cx="46" cy="46" r="8" fill="#2a1810"/>
    <circle cx="46" cy="46" r="6.2" fill="#ffd700"/>
    <polyline points="43,46 45.2,48.5 49.2,43.8" fill="none" stroke="#2a1810" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- State 4: Disabled (168 - 224) 灰化 -->
  <g transform="translate(168,0)" opacity="0.45">
    <circle cx="28" cy="28" r="26.5" fill="url(#slotBg)" stroke="#5d4e37" stroke-width="2"/>
  </g>
</svg>
