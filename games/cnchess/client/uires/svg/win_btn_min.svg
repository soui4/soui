<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" viewBox="0 0 112 20">
  <!-- 最小化按钮 4态 (28x20) 金色主题 -->
  <defs>
    <rect id="under" x="0.5" y="0.5" width="27" height="19" rx="4" ry="4"/>
    <g id="glyph">
      <path d="M8 12 L20 12" stroke="#DAA520" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 态1 Normal: 半透明暗底 + 柔和金色 -->
  <use href="#under" fill="rgba(0,0,0,0)" stroke="#5D4E37" stroke-width="1"/>
  <use href="#glyph" opacity="0.6"/>

  <!-- 态2 Hover: 金色亮底 + 深色图标 -->
  <use href="#under" x="28" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
  <g transform="translate(28,0)"><g id="glyph2"><path d="M8 12 L20 12" stroke="#2A1810" stroke-width="2" stroke-linecap="round"/></g></g>

  <!-- 态3 Pressed: 深金色底 -->
  <use href="#under" x="56" fill="#B8860B" stroke="#8B6B1F" stroke-width="1"/>
  <g transform="translate(56,0)"><g id="glyph3"><path d="M8 12 L20 12" stroke="#1E0F07" stroke-width="2" stroke-linecap="round"/></g></g>

  <!-- 态4 Disabled: 灰 -->
  <use href="#under" x="84" fill="rgba(0,0,0,0)" stroke="#5D4E37" stroke-width="1" opacity="0.5"/>
  <g transform="translate(84,0)"><g id="glyph4"><path d="M8 12 L20 12" stroke="#5D4E37" stroke-width="2" stroke-linecap="round"/></g></g>
</svg>