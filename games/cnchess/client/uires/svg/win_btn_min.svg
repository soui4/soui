<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" viewBox="0 0 112 20">
  <!-- 最小化按钮 4态 (每态28x20) 金色主题 -->

  <!-- 态1 Normal: 半透明暗底 + 柔和金色横线 -->
  <rect x="0.5" y="0.5" width="27" height="19" rx="4" ry="4" fill="rgba(0,0,0,0)" stroke="#5D4E37" stroke-width="1"/>
  <path d="M9.5 12 L18.5 12" stroke="#DAA520" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- 态2 Hover: 金色亮底 + 深色图标 -->
  <rect x="28.5" y="0.5" width="27" height="19" rx="4" ry="4" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
  <path d="M37.5 12 L46.5 12" stroke="#2A1810" stroke-width="2" stroke-linecap="round"/>

  <!-- 态3 Pressed: 深金色底 -->
  <rect x="56.5" y="0.5" width="27" height="19" rx="4" ry="4" fill="#B8860B" stroke="#8B6B1F" stroke-width="1"/>
  <path d="M65.5 12 L74.5 12" stroke="#1E0F07" stroke-width="2" stroke-linecap="round"/>

  <!-- 态4 Disabled: 灰 -->
  <rect x="84.5" y="0.5" width="27" height="19" rx="4" ry="4" fill="rgba(0,0,0,0)" stroke="#5D4E37" stroke-width="1" opacity="0.5"/>
  <path d="M93.5 12 L102.5 12" stroke="#5D4E37" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>