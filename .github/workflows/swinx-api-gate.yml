name: swinx API surface gate

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swinx-api-surface:
    name: swinx API surface gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 子模块改从 GitHub 镜像拉取：.gitmodules 里指向 gitee，GitHub runner 上不可靠
      # （clone 失败或超时）。映射表与 build.yml 保持一致，改一处要五处一起改。
      - name: Checkout submodules from GitHub mirror
        shell: bash
        run: |
          git config --global url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx"
          git config --global url."https://github.com/setoutsoft/libwebsockets".insteadOf "https://gitee.com/setoutsoft/libwebsockets"
          git config --global url."https://github.com/setoutsoft/openssl-cmake".insteadOf "https://gitee.com/setoutsoft/openssl-cmake"
          git config --global url."https://github.com/setoutsoft/curl".insteadOf "https://gitee.com/setoutsoft/curl"
          # 本门禁只扫 swinx 头文件、不编译，因此只取 swinx 一个子模块：
          # 少拉三个 third-part 仓库就少三种失败模式。
          git submodule update --init swinx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # 纯文本扫描（约 2 分钟，无需编译）：swinx 头文件声明的 Win32 API 面是否仍与
      # 已提交的 swinx/doc/tools/api_scan.json 一致。动了实现却没刷新清单 ⇒ 失败；
      # 本地跑 `python swinx/doc/tools/api_scan.py` 重新生成清单并提交即可。
      - name: Check api_scan.json is in sync with swinx sources
        run: python swinx/doc/tools/api_scan.py --check
