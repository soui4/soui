name: build

on:
  push:
    tags:
      - "*"
    branches:
      - "build-test"

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.dist }}
    strategy:
      fail-fast: false
      matrix:
        os: [Windows, Linux, macOS]
        arch: [x64, x86, arm64]
        include:
          - os: Windows
            dist: windows-latest
          - os: Linux
            dist: ubuntu-latest
          - os: Linux
            arch: arm64
            dist: ubuntu-22.04-arm
          - os: Windows
            arch: x86
            platform: Win32
          - os: Windows
            arch: arm64
            platform: ARM64
          - os: macOS
            arch: x64
            dist: macos-26-intel  # Intel runner；macos-15/26 裸标签是 arm64，x64 必须用 -intel
          - os: macOS
            arch: arm64
            dist: macos-26  # Apple Silicon runner for arm64；macos-14 已退役、arm64 队列用最新 GA 镜像
        exclude:
          - os: Linux
            arch: x86
          - os: macOS
            arch: x86  # macOS doesn't support x86 anymore

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Checkout submodules from GitHub mirror
      shell: bash
      run: |
        # 子模块在 GitHub 上的镜像与 gitee 组织不一致，逐仓库改写（本地 .gitmodules 不动）：
        #   swinx         -> github.com/soui4/swinx
        #   libwebsockets -> github.com/setoutsoft/libwebsockets
        #   openssl-cmake -> github.com/setoutsoft/openssl-cmake
        #   curl          -> github.com/setoutsoft/curl
        # 分支信息（branch = master / soui_ws 等）仍来自 .gitmodules。
        git config --global url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx"
        git config --global url."https://github.com/setoutsoft/libwebsockets".insteadOf "https://gitee.com/setoutsoft/libwebsockets"
        git config --global url."https://github.com/setoutsoft/openssl-cmake".insteadOf "https://gitee.com/setoutsoft/openssl-cmake"
        git config --global url."https://github.com/setoutsoft/curl".insteadOf "https://gitee.com/setoutsoft/curl"
        git config --global url."https://github.com/setoutsoft/soui-freertos".insteadOf "https://gitee.com/setoutsoft/soui-freertos"
        git submodule update --init --recursive

    - name: Set up CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "^3.25.0"

    - name: Install dependencies (Ubuntu)
      if: startsWith(matrix.dist, 'ubuntu')
      # swinx_wke_script 的 SSA_FALLBACK 用例要求系统有覆盖 U+4E2D/U+6587 的字体；
      # ubuntu-22.04-arm 镜像只预装 fonts-noto-color-emoji，必须显式补 CJK 字体。
      run: sudo apt-get update && sudo apt install -y cmake  build-essential xvfb libxcb1-dev libxcb-render0-dev uuid-dev libasound2-dev libgl1-mesa-dev freeglut3-dev pkg-config mingw-w64 fonts-noto-cjk --fix-missing

    - name: Install dependencies (macOS)
      if: matrix.os == 'macOS'
      run: |
        brew update
        brew install ninja pkgconf glfw glew mingw-w64

    - name: Configure CMake (Linux x64)
      if: matrix.os == 'Linux' && matrix.arch == 'x64'
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DSOUI_FUN_TEST_POST_BUILD=OFF

    - name: Configure CMake (Linux arm64)
      if: matrix.os == 'Linux' && matrix.arch == 'arm64'
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DPNG_HARDWARE_OPTIMIZATIONS=OFF  -DSOUI_FUN_TEST_POST_BUILD=OFF

    # Windows 保持 MinGW + Ninja（runner 无 MSVC 环境时 CMake 自动选中 MinGW GCC，
    # 2026-09-30 的构建即为此组合，2214 个目标全部编过）。
    # 注意：Ninja 是单配置生成器，exe/dll 直接输出到 build/bin/（没有 Release 子目录），
    # 而 games 资源按 $<CONFIGURATION> 固定落在 build/bin/Release/；
    # 打包前用 staging 步骤把可执行产物与 demo_res 汇入 build/bin/Release/，统一布局后上传。
    - name: Configure CMake (Windows)
      if: matrix.os == 'Windows'
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja

    - name: Configure CMake (macOS x64)
      if: matrix.os == 'macOS' && matrix.arch == 'x64'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DCMAKE_C_COMPILER=/usr/bin/clang \
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++

    - name: Configure CMake (macOS arm64)
      if: matrix.os == 'macOS' && matrix.arch == 'arm64'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_C_COMPILER=/usr/bin/clang \
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DPNG_HARDWARE_OPTIMIZATIONS=OFF

    - name: Build (Windows/Linux)
      if: matrix.os != 'macOS'
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Build (macOS)
      if: matrix.os == 'macOS'
      run: ninja -C build

    - name: Run unit, integration and core E2E checks (Linux, under Xvfb)
      if: matrix.os == 'Linux'
      run: xvfb-run -a ctest --test-dir build -L '^soui-headless$' --output-on-failure

    - name: Run unit, integration and core E2E checks
      if: matrix.os != 'Linux'
      run: ctest --test-dir build -L '^soui-headless$' --output-on-failure

    # MinGW/Ninja 单配置布局：exe/dll/exctrl/demo_res 直接在 build/bin/，
    # junqi/cnchess/upgrade/config 资源因 CMakeLists 用 $<CONFIGURATION> 固定落在
    # build/bin/Release/（zip 内会保留 Release/ 这一层级）。
    - name: Upload demo (Windows)
      if: matrix.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: demo-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          build/bin/*.exe
          build/bin/*.dll
          build/bin/*.exctrl
          build/bin/demo_res/**
          build/bin/${{ env.BUILD_TYPE }}/junqi/**
          build/bin/${{ env.BUILD_TYPE }}/cnchess/**
          build/bin/${{ env.BUILD_TYPE }}/upgrade/**
          build/bin/${{ env.BUILD_TYPE }}/Config/**

    - name: Create file structure (Windows)
      if: matrix.os == 'Windows'
      run: tree /F /A | Out-File file_structure.txt

    - name: Create file structure (Linux)
      if: matrix.os == 'Linux'
      run: tree -a > file_structure.txt

    - name: Create file structure (macOS)
      if: matrix.os == 'macOS'
      run: find . -type f -name "*.dylib" -o -name "*.app" -o -name "demo*" | head -50 > file_structure.txt

    - name: Upload demo (Linux)
      if: matrix.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: demo-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          build/bin/*
          build/bin/*.exctrl
          build/bin/Config/**
          build/bin/junqi/**
          build/bin/cnchess/**
          build/bin/upgrade/**
          build/bin/demo_res/**
          !build/bin/*.a
          !build/bin/*.o

    - name: Upload demo (macOS)
      if: matrix.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: demo-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          build/bin/*
          build/bin/*.exctrl
          build/bin/junqi/**
          build/bin/cnchess/**
          build/bin/upgrade/**
          build/bin/Config/**
          build/bin/demo_res/**
          !build/bin/*.a
          !build/bin/*.o

    - name: Upload file structure
      uses: actions/upload-artifact@v4
      with:
        name: file_structure-${{ matrix.os }}-${{ matrix.arch }}
        path: file_structure.txt


  build-ios:
    name: Build for iOS-arm64
    # build.yml 原本只有桌面 matrix，iOS 完全不在主流程里（仅在 mobile gate 且只有
    # swinx 子模块变化时触发）。这里补一个固定 arm64 的 job：iOS 只允许静态库，
    # 复用 swinx 自带的 cross_build.py，产物形态与 mobile gate 保持一致。
    runs-on: macos-26
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Checkout submodules from GitHub mirror
      shell: bash
      run: |
        # 映射表与主 build job 保持一致，改一处要五处一起改。
        git config --global url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx"
        git config --global url."https://github.com/setoutsoft/libwebsockets".insteadOf "https://gitee.com/setoutsoft/libwebsockets"
        git config --global url."https://github.com/setoutsoft/openssl-cmake".insteadOf "https://gitee.com/setoutsoft/openssl-cmake"
        git config --global url."https://github.com/setoutsoft/curl".insteadOf "https://gitee.com/setoutsoft/curl"
        git config --global url."https://github.com/setoutsoft/soui-freertos".insteadOf "https://gitee.com/setoutsoft/soui-freertos"
        git submodule update --init --recursive

    - name: Set up CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "^3.25.0"

    - name: Cross-compile swinx (arm64, iphoneos, static)
      run: |
        python3 swinx/tools/cross_build.py ios \
          --abi arm64 \
          --generator Ninja \
          --jobs 4 \
          --build "$RUNNER_TEMP/swinx-ios-arm64"

    # cross_build.py 已按 Mach-O cputype 比对过架构，这里用 lipo 独立复核一次，
    # 避免两处共用同一套误判逻辑而同时放行错误产物。
    - name: Verify the artifact is real arm64 Mach-O
      run: |
        LIB=$(find "$RUNNER_TEMP/swinx-ios-arm64" -name 'libswinx.a' | head -1)
        if [ -z "$LIB" ]; then
          echo "::error::没有生成 libswinx.a（iOS 侧应为静态库）"
          exit 1
        fi
        file "$LIB"
        lipo -info "$LIB" | tee /tmp/lipo.txt
        grep -q arm64 /tmp/lipo.txt
