name: build

on:
  push:
    tags:
      - "*"
    branches:
      - "build-test"

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    name: Build for ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.dist }}
    strategy:
      fail-fast: false
      matrix:
        os: [Windows, Linux, macOS]
        arch: [x64, x86, arm64]
        include:
          - os: Windows
            dist: windows-latest
          - os: Linux
            dist: ubuntu-latest
          - os: Linux
            arch: arm64
            dist: ubuntu-22.04-arm
          - os: Windows
            arch: x86
            platform: Win32
          - os: Windows
            arch: arm64
            platform: ARM64
          - os: macOS
            arch: x64
            dist: macos-15  # Intel-based runner for x64
          - os: macOS
            arch: arm64
            dist: macos-14  # Apple Silicon runner for arm64
        exclude:
          - os: Linux
            arch: x86
          - os: macOS
            arch: x86  # macOS doesn't support x86 anymore

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Checkout submodules from GitHub mirror
      shell: bash
      run: |
        # 子模块在 GitHub 上的镜像与 gitee 组织不一致，逐仓库改写（本地 .gitmodules 不动）：
        #   swinx         -> github.com/soui4/swinx
        #   libwebsockets -> github.com/setoutsoft/libwebsockets
        #   openssl-cmake -> github.com/setoutsoft/openssl-cmake
        #   curl          -> github.com/setoutsoft/curl
        # 分支信息（branch = master / soui_ws 等）仍来自 .gitmodules。
        git config --global url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx"
        git config --global url."https://github.com/setoutsoft/libwebsockets".insteadOf "https://gitee.com/setoutsoft/libwebsockets"
        git config --global url."https://github.com/setoutsoft/openssl-cmake".insteadOf "https://gitee.com/setoutsoft/openssl-cmake"
        git config --global url."https://github.com/setoutsoft/curl".insteadOf "https://gitee.com/setoutsoft/curl"
        git submodule update --init --recursive

    - name: Set up CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "^3.25.0"

    - name: Install dependencies (Ubuntu)
      if: startsWith(matrix.dist, 'ubuntu')
      run: sudo apt-get update && sudo apt install -y cmake  build-essential xvfb libxcb1-dev libxcb-render0-dev uuid-dev libasound2-dev libgl1-mesa-dev freeglut3-dev pkg-config mingw-w64 --fix-missing

    - name: Install dependencies (macOS)
      if: matrix.os == 'macOS'
      run: |
        brew update
        brew install ninja pkgconf glfw glew mingw-w64

    - name: Configure CMake (Linux x64)
      if: matrix.os == 'Linux' && matrix.arch == 'x64'
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DSOUI_FUN_TEST_POST_BUILD=OFF

    - name: Configure CMake (Linux arm64)
      if: matrix.os == 'Linux' && matrix.arch == 'arm64'
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DPNG_HARDWARE_OPTIMIZATIONS=OFF  -DSOUI_FUN_TEST_POST_BUILD=OFF

    # Windows 保持 MinGW + Ninja（runner 无 MSVC 环境时 CMake 自动选中 MinGW GCC，
    # 2026-09-30 的构建即为此组合，2214 个目标全部编过）。
    # 注意：Ninja 是单配置生成器，exe/dll 直接输出到 build/bin/（没有 Release 子目录），
    # 而 games 资源按 $<CONFIGURATION> 固定落在 build/bin/Release/；
    # 打包前用 staging 步骤把可执行产物与 demo_res 汇入 build/bin/Release/，统一布局后上传。
    - name: Configure CMake (Windows)
      if: matrix.os == 'Windows'
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja

    - name: Configure CMake (macOS x64)
      if: matrix.os == 'macOS' && matrix.arch == 'x64'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DCMAKE_C_COMPILER=/usr/bin/clang \
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++

    - name: Configure CMake (macOS arm64)
      if: matrix.os == 'macOS' && matrix.arch == 'arm64'
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -G Ninja \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_C_COMPILER=/usr/bin/clang \
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DPNG_HARDWARE_OPTIMIZATIONS=OFF

    - name: Build (Windows/Linux)
      if: matrix.os != 'macOS'
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Build (macOS)
      if: matrix.os == 'macOS'
      run: ninja -C build

    - name: Run unit, integration and core E2E checks (Linux, under Xvfb)
      if: matrix.os == 'Linux'
      run: xvfb-run -a ctest --test-dir build -L '^soui-headless$' --output-on-failure

    - name: Run unit, integration and core E2E checks
      if: matrix.os != 'Linux'
      run: ctest --test-dir build -L '^soui-headless$' --output-on-failure

    # MinGW/Ninja 单配置布局：exe/dll/exctrl/demo_res 直接在 build/bin/，
    # junqi/cnchess/upgrade/config 资源因 CMakeLists 用 $<CONFIGURATION> 固定落在
    # build/bin/Release/（zip 内会保留 Release/ 这一层级）。
    - name: Upload demo (Windows)
      if: matrix.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: demo-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          build/bin/*.exe
          build/bin/*.dll
          build/bin/*.exctrl
          build/bin/demo_res/**
          build/bin/${{ env.BUILD_TYPE }}/junqi/**
          build/bin/${{ env.BUILD_TYPE }}/cnchess/**
          build/bin/${{ env.BUILD_TYPE }}/upgrade/**
          build/bin/${{ env.BUILD_TYPE }}/Config/**

    - name: Create file structure (Windows)
      if: matrix.os == 'Windows'
      run: tree /F /A | Out-File file_structure.txt

    - name: Create file structure (Linux)
      if: matrix.os == 'Linux'
      run: tree -a > file_structure.txt

    - name: Create file structure (macOS)
      if: matrix.os == 'macOS'
      run: find . -type f -name "*.dylib" -o -name "*.app" -o -name "demo*" | head -50 > file_structure.txt

    - name: Upload demo (Linux)
      if: matrix.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: demo-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          build/bin/*
          build/bin/*.exctrl
          build/bin/Config/**
          build/bin/junqi/**
          build/bin/cnchess/**
          build/bin/upgrade/**
          build/bin/demo_res/**
          !build/bin/*.a
          !build/bin/*.o

    - name: Upload demo (macOS)
      if: matrix.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: demo-${{ matrix.os }}-${{ matrix.arch }}
        path: |
          build/bin/*
          build/bin/*.exctrl
          build/bin/junqi/**
          build/bin/cnchess/**
          build/bin/upgrade/**
          build/bin/Config/**
          build/bin/demo_res/**
          !build/bin/*.a
          !build/bin/*.o

    - name: Upload file structure
      uses: actions/upload-artifact@v4
      with:
        name: file_structure-${{ matrix.os }}-${{ matrix.arch }}
        path: file_structure.txt
