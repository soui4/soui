name: soui wasm gate

# WASM 与 FreeRTOS 一样，此前完全不在 CI 里：浏览器端的一切结论靠人工构建 + 人眼。
# 这条门禁只做一件事——把「wasm 产物还能构建、还能跑通无头烟测」交给机器。
#
# 判据是 demos/wasm-demo/smoke.js：node 直接加载 emscripten 产物，不需要浏览器，
# 覆盖 模块启动链（SApplication → DoConfig → 资源 → SHostWnd → 控件树 → 渲染后端
# 初始化）/ 渲染+上屏整链（SwinxFbPresents 计数随泵增长）/ 输入注入（鼠标/键盘/滚轮
# /IME/剪贴板 经 SwinxInject* 进消息泵不崩）/ ITaskLoop 双后端自测（SwinxDemoTaskLoopSelfTest：
# 投递数、后台执行数、回抛到 UI 线程的次数、内联探针、心跳、停止后与实例计数归零）/
# 异步文件选择（SwinxDemoFilePickSelfTest + 假 Module.swinxPickFile：发起不阻塞主线程、筛选串
# 换算成 accept、回投的字节落到可 fopen 的消毒路径、过期 id 丢弃、多选与 SAVE 显式拒绝）/ 无致命错误。
#
# 两条 matrix 腿分别跑两条 ITaskLoop 后端：wasm-pump 是不带 -pthread 的默认构建（30 处断言），
# wasm-pthreads 带 -DSOUI_WASM_PTHREADS=ON（31 处，多出的两条要求 worker 线程真的起来、任务真的
# 离开 UI 线程 —— 只有真实线程能给出 offUi==posted，泵后端必然给不出）。两条腿各占一台 runner：
# 产物目录 demos/wasm-demo/out 是按源目录写死的（SOUI_WASM_DEMO_OUT），同一台机器上先后两次构建
# 会互相覆盖，另一侧的 ninja 又因时间戳更新报 no work to do，于是"哪条腿测的是哪份产物"就不成立
# （本地实测踩过，见 demos/wasm-demo/readme.md「无头烟测」）。
#
# smoke.js 内部用最小假 DOM 顶上 canvas2d 后端（node 没有 document），所有绘制 no-op、只保证
# measureText/getImageData/createImageData 返回正确形状。它明确不证明"像素好不好看、
# 布局对不对、交互是否正确、字体字形对不对"——那些仍要人看（见 demos/wasm-demo/readme.md）。
# wasm-pthreads 这条也不证明浏览器侧能跑：worker 产物要 crossOriginIsolated（COOP+COEP 响应头），
# node 里没有这道前提，Chromium 里仍要按 readme 清单人工过一遍。
#
# 演示产物（.wasm 约 5MB 级，取决于 CJK 字体子集化）只用于本次烟测，不上传。

on:
  pull_request:
    paths:
      - 'demos/wasm-demo/**'
      - 'swinx/**'
      - 'SOUI/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - '__cmake/**'
      - '.github/workflows/soui-wasm-gate.yml'
  push:
    branches:
      - master
    paths:
      - 'demos/wasm-demo/**'
      - 'swinx/**'
      - 'SOUI/**'
      - 'components/**'
      - 'CMakeLists.txt'
      - '__cmake/**'
      - '.github/workflows/soui-wasm-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: wasm-${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # fail-fast=false：worker 腿坏了不要把默认腿的结论一起取消，两条后端各自的红/绿要分得开。
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: pump
            pthreads: 'OFF'
            expect_pt: 0
          - backend: pthreads
            pthreads: 'ON'
            expect_pt: 1
    steps:
      - uses: actions/checkout@v4

      # 子模块改从 GitHub 镜像拉取：.gitmodules 里指向 gitee，GitHub runner 上不可靠。
      # 映射表与 build.yml 保持一致，改一处要五处一起改。
      - name: Checkout submodules from GitHub mirror
        shell: bash
        run: |
          git config --global url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx"
          git config --global url."https://github.com/setoutsoft/libwebsockets".insteadOf "https://gitee.com/setoutsoft/libwebsockets"
          git config --global url."https://github.com/setoutsoft/openssl-cmake".insteadOf "https://gitee.com/setoutsoft/openssl-cmake"
          git config --global url."https://github.com/setoutsoft/curl".insteadOf "https://gitee.com/setoutsoft/curl"
          git config --global url."https://github.com/setoutsoft/soui-freertos".insteadOf "https://gitee.com/setoutsoft/soui-freertos"
          git submodule update --init --recursive

      # 纯 emscripten 交叉编译，不需要原生 X11 依赖；ninja 是构建器。
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          node --version

      # 与 build.yml 一样钉住 CMake 3.25+：CMake 4.2 的 Emscripten 工具链会在
      # 配置期报 "does not support emscripten shared libraries"，本仓的 wasm 构建
      # 依赖 BUILD_SHARED_LIBS=OFF 的静态布局，不必去踩这条新边界。
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^3.25.0"

      # 版本与本地验证所用一致（emcc 6.0.13）。升级时请同步改这里的 pin，
      # 并在本地重跑一次 demos/wasm-demo/build-soui.sh + smoke.js 确认全过。
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache

      - name: Show toolchain
        run: |
          emcc --version | head -2
          cmake --version | head -1
          ninja --version

      - name: Configure wasm build
        run: |
          emcmake cmake -S demos/wasm-demo -B build-wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSOUI_WASM_PTHREADS=${{ matrix.pthreads }}

      # -j4 而不是 -j$(nproc)：emcc 在 8 核以上并发时会互相等待到疑似死锁（本地实测
      # 曾在零 CPU 占用下卡住 20 分钟）。构建吞吐不是这条门禁的瓶颈，稳定才是。
      - name: Build soui-wasm-demo
        run: |
          set -o pipefail
          cmake --build build-wasm --target soui-wasm-demo -j4 2>&1 | tee wasm-build.log
          ls -la demos/wasm-demo/out

      - name: Headless smoke test (demos/wasm-demo, ${{ matrix.backend }}, no browser)
        run: |
          set -o pipefail
          node demos/wasm-demo/smoke.js 2>&1 | tee smoke.log
          # 双保险：smoke.js 末尾只在全部断言通过时才打 "OK:"，所以这条 grep 同时能
          # 抓住"进程被 abort / 提前退出后留下一份看着全绿的半截日志"——那种情况下
          # 退出码未必是 1，但收尾行一定缺失。
          grep -q '^OK: 全部断言通过$' smoke.log
          # 再钉一句"这条腿吃的确实是这条配置的产物"：pt 由 C++ 侧的 __EMSCRIPTEN_PTHREADS__
          # 决定，产物拿错了这里就对不上。
          grep -q '\[taskloop\] pt=${{ matrix.expect_pt }}' smoke.log

      # 失败时把两份日志带出来，省去重跑一遍才能看报错。产物名带 matrix 标签，两条腿不覆盖。
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.backend }}-logs
          path: |
            wasm-build.log
            smoke.log
          if-no-files-found: warn
