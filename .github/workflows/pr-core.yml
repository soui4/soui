name: PR core validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  core-linux-x64:
    name: core-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 子模块改从 GitHub 镜像拉取：.gitmodules 里指向 gitee，GitHub runner 上不可靠
      # （clone 失败或超时）。映射表与 build.yml 保持一致，改一处要五处一起改。
      - name: Checkout submodules from GitHub mirror
        shell: bash
        run: |
          git config --global url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx"
          git config --global url."https://github.com/setoutsoft/libwebsockets".insteadOf "https://gitee.com/setoutsoft/libwebsockets"
          git config --global url."https://github.com/setoutsoft/openssl-cmake".insteadOf "https://gitee.com/setoutsoft/openssl-cmake"
          git config --global url."https://github.com/setoutsoft/curl".insteadOf "https://gitee.com/setoutsoft/curl"
          git submodule update --init --recursive
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^3.25.0"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gdb xvfb libxcb1-dev libxcb-render0-dev uuid-dev libasound2-dev libgl1-mesa-dev freeglut3-dev libglfw3-dev libglew-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSOUI_BUILD_GAMES=OFF -DSOUI_FUN_TEST_POST_BUILD=OFF
      - name: Build fun_test
        run: cmake --build build --target fun_test --parallel 4
      - name: Run basic validation
        run: xvfb-run -a ctest --test-dir build -L '^soui-headless$' --output-on-failure
      # OpenGL 冒烟：opengl_demo 的 --selftest 会跑 16 条 WGL 入口契约断言 +
      # 三张截图（固定管线 / GLSL+VBO / 销毁重建上下文），并对失败返回非 0。
      # 用 Xvfb + Mesa 软渲染（llvmpipe），不需要 GPU。
      - name: Build opengl_demo
        run: cmake --build build --target opengl_demo --parallel 4
      - name: Run OpenGL smoke (WGL contract tests)
        run: |
          cd build/bin
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe \
            xvfb-run -a -s "-screen 0 1280x1024x24" ./opengl_demo --selftest
      - name: Show OpenGL smoke report
        if: always()
        run: |
          for f in build/bin/opengl_selftest.txt build/bin/opengl_apitest.txt; do
            if [ -f "$f" ]; then
              echo "===== $f"
              cat "$f"
            fi
          done
      - name: Diagnose failing SOUI cases
        if: failure()
        run: |
          cd build/demos/fun_test
          xvfb-run -a gdb -q -batch -ex 'set args --gtest_filter=soui_component.resprovider_zip_load_and_read' -ex run -ex 'thread apply all bt 20' -- ../../bin/fun_test
          xvfb-run -a gdb -q -batch -ex 'set args --gtest_filter=soui_window.named_child_lookup_respects_depth' -ex run -ex 'thread apply all bt 20' -- ../../bin/fun_test

  core-windows-x64:
    name: core-windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 子模块改从 GitHub 镜像拉取：.gitmodules 里指向 gitee，GitHub runner 上不可靠
      # （clone 失败或超时）。映射表与 build.yml 保持一致，改一处要五处一起改。
      - name: Checkout submodules from GitHub mirror
        shell: bash
        run: |
          git config --global url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx"
          git config --global url."https://github.com/setoutsoft/libwebsockets".insteadOf "https://gitee.com/setoutsoft/libwebsockets"
          git config --global url."https://github.com/setoutsoft/openssl-cmake".insteadOf "https://gitee.com/setoutsoft/openssl-cmake"
          git config --global url."https://github.com/setoutsoft/curl".insteadOf "https://gitee.com/setoutsoft/curl"
          git submodule update --init --recursive
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^3.25.0"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSOUI_BUILD_GAMES=OFF -DSOUI_FUN_TEST_POST_BUILD=OFF
      - name: Build fun_test
        run: cmake --build build --target fun_test --parallel 4
      - name: Run basic validation
        run: ctest --test-dir build -L '^soui-headless$' --output-on-failure

  core-macos-arm64:
    name: core-macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # 子模块改从 GitHub 镜像拉取：.gitmodules 里指向 gitee，GitHub runner 上不可靠
      # （clone 失败或超时）。映射表与 build.yml 保持一致，改一处要五处一起改。
      - name: Checkout submodules from GitHub mirror
        shell: bash
        run: |
          git config --global url."https://github.com/soui4/swinx".insteadOf "https://gitee.com/setoutsoft/swinx"
          git config --global url."https://github.com/setoutsoft/libwebsockets".insteadOf "https://gitee.com/setoutsoft/libwebsockets"
          git config --global url."https://github.com/setoutsoft/openssl-cmake".insteadOf "https://gitee.com/setoutsoft/openssl-cmake"
          git config --global url."https://github.com/setoutsoft/curl".insteadOf "https://gitee.com/setoutsoft/curl"
          git submodule update --init --recursive
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "^3.25.0"
      - name: Install dependencies
        run: brew install ninja pkgconf glfw glew
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPNG_HARDWARE_OPTIMIZATIONS=OFF
          -DSOUI_BUILD_GAMES=OFF
          -DSOUI_FUN_TEST_POST_BUILD=OFF
      - name: Build fun_test
        run: cmake --build build --target fun_test --parallel 4
      - name: Run basic validation
        run: ctest --test-dir build -L '^soui-headless$' --output-on-failure
      # OpenGL 冒烟：macOS 侧走 NSOpenGLContext（swinx 的 SGLBridge + 视图绑定栈），
      # 与 Linux 的 GLX 分支是两套实现，必须各测一遍。
      - name: Build opengl_demo
        run: cmake --build build --target opengl_demo --parallel 4
      - name: Run OpenGL smoke (WGL contract tests)
        run: |
          cd build/bin
          ./opengl_demo --selftest
      - name: Show OpenGL smoke report
        if: always()
        run: |
          for f in build/bin/opengl_selftest.txt build/bin/opengl_apitest.txt; do
            if [ -f "$f" ]; then
              echo "===== $f"
              cat "$f"
            fi
          done
