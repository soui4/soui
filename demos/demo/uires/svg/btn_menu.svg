<?xml version="1.0" encoding="UTF-8"?>
<!--
  btn_menu.svg - 标题栏"菜单"按钮图标(nanosvg 兼容)
  3 帧横排,每帧 20x20,总尺寸 60x20。
  帧序与 SOUI imgbtn 三态约定一致:0=normal  1=hover  2=push
  图形:三横线菜单,三态用不同亮度区分。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="20" viewBox="0 0 60 20">
  <!-- 帧0:normal #5F6672 -->
  <g transform="translate(0,0)" stroke="#5F6672" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="4" y1="5.5"  x2="16" y2="5.5"/>
    <line x1="4" y1="10"   x2="16" y2="10"/>
    <line x1="4" y1="14.5" x2="16" y2="14.5"/>
  </g>
  <!-- 帧1:hover #0E9F9F -->
  <g transform="translate(20,0)" stroke="#0E9F9F" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="4" y1="5.5"  x2="16" y2="5.5"/>
    <line x1="4" y1="10"   x2="16" y2="10"/>
    <line x1="4" y1="14.5" x2="16" y2="14.5"/>
  </g>
  <!-- 帧2:push #0B7F7F -->
  <g transform="translate(40,0)" stroke="#0B7F7F" stroke-width="1.8" stroke-linecap="round" fill="none">
    <line x1="4" y1="5.5"  x2="16" y2="5.5"/>
    <line x1="4" y1="10"   x2="16" y2="10"/>
    <line x1="4" y1="14.5" x2="16" y2="14.5"/>
  </g>
</svg>
