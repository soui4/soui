<?xml version="1.0" encoding="UTF-8"?>
<!--
  ctrl_icons.svg - 控件分类小图标雪碧图(nanosvg 兼容)
  18 帧横排,每帧 24x24,总尺寸 432x24。
  帧序与 page_ctrls.xml 中 grouplist 各 item 的 icon="0..17" 语义一致:
    0=多列列表  1=基础列表  2=固定高列表  3=可变高列表  4=TileView  5=扩展多列列表
    6=TreeCtrl  7=TreeView  8=编辑器    9=富文本    10=按钮    11=radio
    12=进度条   13=分割窗   14=列表框    15=日历     16=属性表   17=更多
  风格:描边线条式,主色 #2563EB
-->
<svg xmlns="http://www.w3.org/2000/svg" width="432" height="24" viewBox="0 0 432 24">
  <!-- 帧0:多列列表(带表头与列分隔) -->
  <g transform="translate(0,0)">
    <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="3" y1="9.5" x2="21" y2="9.5" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="3" y1="14" x2="21" y2="14" stroke="#93C5FD" stroke-width="1.2"/>
    <line x1="3" y1="18" x2="21" y2="18" stroke="#93C5FD" stroke-width="1.2"/>
    <line x1="9" y1="9.5" x2="9" y2="20" stroke="#93C5FD" stroke-width="1.2"/>
    <line x1="15" y1="9.5" x2="15" y2="20" stroke="#93C5FD" stroke-width="1.2"/>
    <rect x="3" y="4" width="18" height="5.5" rx="2" fill="#2563EB" opacity="0.18"/>
  </g>
  <!-- 帧1:基础列表(圆点+文本行) -->
  <g transform="translate(24,0)">
    <circle cx="6" cy="7" r="1.8" fill="#2563EB"/>
    <circle cx="6" cy="12" r="1.8" fill="#2563EB"/>
    <circle cx="6" cy="17" r="1.8" fill="#2563EB"/>
    <line x1="10" y1="7" x2="20" y2="7" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="10" y1="12" x2="20" y2="12" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="10" y1="17" x2="20" y2="17" stroke="#2563EB" stroke-width="1.6"/>
  </g>
  <!-- 帧2:固定高列表(等距行) -->
  <g transform="translate(48,0)">
    <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="4" y1="9.3" x2="20" y2="9.3" stroke="#93C5FD" stroke-width="1.2"/>
    <line x1="4" y1="14.6" x2="20" y2="14.6" stroke="#93C5FD" stroke-width="1.2"/>
  </g>
  <!-- 帧3:可变高列表(不等距行) -->
  <g transform="translate(72,0)">
    <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="4" y1="8.5" x2="20" y2="8.5" stroke="#93C5FD" stroke-width="1.2"/>
    <line x1="4" y1="15.5" x2="20" y2="15.5" stroke="#93C5FD" stroke-width="1.2"/>
  </g>
  <!-- 帧4:TileView(2x2 方块) -->
  <g transform="translate(96,0)">
    <rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="13" y="4" width="7" height="7" rx="1.5" fill="#2563EB" opacity="0.25"/>
    <rect x="4" y="13" width="7" height="7" rx="1.5" fill="#2563EB" opacity="0.25"/>
    <rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="#2563EB" stroke-width="1.6"/>
  </g>
  <!-- 帧5:扩展多列列表(实心表头) -->
  <g transform="translate(120,0)">
    <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="3" y="4" width="18" height="6" rx="2" fill="#2563EB" opacity="0.4"/>
    <line x1="9" y1="10" x2="9" y2="20" stroke="#93C5FD" stroke-width="1.2"/>
    <line x1="15" y1="10" x2="15" y2="20" stroke="#93C5FD" stroke-width="1.2"/>
    <line x1="3" y1="15" x2="21" y2="15" stroke="#93C5FD" stroke-width="1.2"/>
  </g>
  <!-- 帧6:TreeCtrl(树形连线+方框节点) -->
  <g transform="translate(144,0)">
    <line x1="8" y1="6.5" x2="8" y2="20.5" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="8" y1="6.5" x2="12" y2="6.5" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="8" y1="13.5" x2="12" y2="13.5" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="8" y1="20.5" x2="12" y2="20.5" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="12" y="4" width="7" height="5" rx="1" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="12" y="11" width="7" height="5" rx="1" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="12" y="18" width="7" height="5" rx="1" fill="none" stroke="#2563EB" stroke-width="1.6"/>
  </g>
  <!-- 帧7:TreeView(文件夹树) -->
  <g transform="translate(168,0)">
    <path d="M3,5 L8,5 L9.5,6.5 L13,6.5 L13,10 L3,10 Z" fill="#2563EB" opacity="0.3"/>
    <path d="M3,5 L8,5 L9.5,6.5 L13,6.5 L13,10 L3,10 Z" fill="none" stroke="#2563EB" stroke-width="1.4"/>
    <path d="M8,12 L13,12 L14.5,13.5 L20,13.5 L20,17 L8,17 Z" fill="none" stroke="#2563EB" stroke-width="1.4"/>
    <line x1="5" y1="10" x2="5" y2="14.5" stroke="#2563EB" stroke-width="1.4"/>
    <line x1="5" y1="14.5" x2="8" y2="14.5" stroke="#2563EB" stroke-width="1.4"/>
  </g>
  <!-- 帧8:编辑器(输入框+光标) -->
  <g transform="translate(192,0)">
    <rect x="3" y="8" width="18" height="8" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="7" y1="10" x2="7" y2="14" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="10" y1="12" x2="17" y2="12" stroke="#93C5FD" stroke-width="1.4"/>
  </g>
  <!-- 帧9:富文本(文档+画笔) -->
  <g transform="translate(216,0)">
    <rect x="4" y="3" width="13" height="18" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="7" y1="8" x2="14" y2="8" stroke="#93C5FD" stroke-width="1.4"/>
    <line x1="7" y1="12" x2="14" y2="12" stroke="#93C5FD" stroke-width="1.4"/>
    <path d="M14,21 L21,14 L22.5,15.5 L15.5,22.5 L13.5,23 Z" fill="#2563EB"/>
  </g>
  <!-- 帧10:按钮(圆角按钮) -->
  <g transform="translate(240,0)">
    <rect x="3" y="8" width="18" height="8" rx="4" fill="#2563EB"/>
    <line x1="8" y1="12" x2="16" y2="12" stroke="#FFFFFF" stroke-width="1.6"/>
  </g>
  <!-- 帧11:radio(单选圆点) -->
  <g transform="translate(264,0)">
    <circle cx="12" cy="12" r="7.5" fill="none" stroke="#2563EB" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="3.2" fill="#2563EB"/>
  </g>
  <!-- 帧12:进度条 -->
  <g transform="translate(288,0)">
    <rect x="3" y="9.5" width="18" height="5" rx="2.5" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="4.8" y="11.2" width="8" height="1.6" rx="0.8" fill="#2563EB"/>
  </g>
  <!-- 帧13:分割窗(十字分割) -->
  <g transform="translate(312,0)">
    <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="12" y1="4" x2="12" y2="20" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="3" y1="12" x2="21" y2="12" stroke="#2563EB" stroke-width="1.6"/>
    <rect x="4" y="5" width="7" height="6" fill="#2563EB" opacity="0.2"/>
  </g>
  <!-- 帧14:列表框及组合框(下拉框) -->
  <g transform="translate(336,0)">
    <rect x="3" y="7" width="18" height="10" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="6" y1="12" x2="13" y2="12" stroke="#93C5FD" stroke-width="1.4"/>
    <path d="M16,10.5 L17.8,13.2 L19.6,10.5" fill="none" stroke="#2563EB" stroke-width="1.6"/>
  </g>
  <!-- 帧15:日历 -->
  <g transform="translate(360,0)">
    <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="3" y1="10" x2="21" y2="10" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="8" y1="3" x2="8" y2="7" stroke="#2563EB" stroke-width="1.8"/>
    <line x1="16" y1="3" x2="16" y2="7" stroke="#2563EB" stroke-width="1.8"/>
    <circle cx="8" cy="14" r="1.2" fill="#2563EB"/>
    <circle cx="12" cy="14" r="1.2" fill="#93C5FD"/>
    <circle cx="16" cy="14" r="1.2" fill="#93C5FD"/>
    <circle cx="8" cy="17.5" r="1.2" fill="#93C5FD"/>
    <circle cx="12" cy="17.5" r="1.2" fill="#93C5FD"/>
  </g>
  <!-- 帧16:属性表(两列表格) -->
  <g transform="translate(384,0)">
    <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="10" y1="4" x2="10" y2="20" stroke="#2563EB" stroke-width="1.6"/>
    <line x1="3" y1="9.3" x2="21" y2="9.3" stroke="#93C5FD" stroke-width="1.2"/>
    <line x1="3" y1="14.6" x2="21" y2="14.6" stroke="#93C5FD" stroke-width="1.2"/>
    <rect x="3" y="4" width="7" height="16" fill="#2563EB" opacity="0.15"/>
  </g>
  <!-- 帧17:更多(省略号) -->
  <g transform="translate(408,0)">
    <circle cx="6" cy="12" r="2.2" fill="#2563EB"/>
    <circle cx="12" cy="12" r="2.2" fill="#2563EB" opacity="0.55"/>
    <circle cx="18" cy="12" r="2.2" fill="#2563EB" opacity="0.55"/>
  </g>
</svg>
