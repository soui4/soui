<?xml version="1.0" encoding="UTF-8"?>
<!--
  focus_ani.svg - 焦点移动动画框(SHostWnd 焦点动画的皮肤源,nanosvg 兼容)
  单帧 32x24:四周各留 1px 画 2px 描边,中间镂空,只画边框不遮住控件内容。
  九宫格拉伸(margin 6)时四角圆弧保持原样,只有四条边被拉长,所以能适配任意大小的焦点窗口。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="24" viewBox="0 0 32 24">
  <rect x="1" y="1" width="30" height="22" rx="5" ry="5"
        fill="#169ADA" fill-opacity="0.08"
        stroke="#169ADA" stroke-width="2"/>
</svg>
