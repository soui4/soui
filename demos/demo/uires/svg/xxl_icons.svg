<?xml version="1.0" encoding="UTF-8"?>
<!--
  xxl_icons.svg - 消消乐棋子雪碧图(nanosvg 兼容)
  7 帧横排,每帧 64x64,总尺寸 448x64。
  帧序: 0=苹果 1=橙子 2=柠檬 3=葡萄 4=西瓜 5=樱桃 6=星星
  风格: 市面常见消消乐的糖果水果风(径向渐变+左上高光+落地阴影)。
-->
