<?xml version="1.0" encoding="UTF-8"?>
<!--
  win_icons.svg - 标题栏系统按钮图标(nanosvg 兼容)
  4 帧横排,每帧 18x18,总尺寸 72x18。
  帧序:0=最小化  1=最大化  2=还原  3=关闭

  用矢量替代 _skin.sys.btn.* 的位图皮肤:位图在高 DPI 下被拉伸会发虚,
  矢量按目标尺寸栅格化,边缘更干净。
  描边色 #4E5560 比原来的浅灰更深,避免在高 DPI 下看起来"灰蒙蒙"。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="18" viewBox="0 0 72 18">

  <!-- 帧0:最小化 -->
  <g transform="translate(0,0)" stroke="#4E5560" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="5.5" y1="9" x2="12.5" y2="9"/>
  </g>

  <!-- 帧1:最大化 -->
  <g transform="translate(18,0)" stroke="#4E5560" stroke-width="1.5" fill="none">
    <rect x="5" y="5" width="8" height="8" rx="1.4"/>
  </g>

  <!-- 帧2:还原(两个错位方框) -->
  <g transform="translate(36,0)" stroke="#4E5560" stroke-width="1.4" fill="none">
    <path d="M6.8 4.6h6.6a1.2 1.2 0 0 1 1.2 1.2v6.6"/>
    <rect x="4.4" y="6.8" width="6.8" height="6.8" rx="1.2"/>
  </g>

  <!-- 帧3:关闭 -->
  <g transform="translate(54,0)" stroke="#4E5560" stroke-width="1.5" stroke-linecap="round" fill="none">
    <line x1="5.6" y1="5.6" x2="12.4" y2="12.4"/>
    <line x1="12.4" y1="5.6" x2="5.6" y2="12.4"/>
  </g>
</svg>
