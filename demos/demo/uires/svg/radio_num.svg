<?xml version="1.0" encoding="UTF-8"?>
<!--
  radio_num.svg - 数字型单选按钮底(3 态,nanosvg 兼容)
  每帧 34x34,总尺寸 102x34。
  imglist 默认 checkAsPushdown=true:0=normal 1=hover 2=checked/pushdown。
  未选中为浅灰圆环,选中为青色实心圆;数字由子 <text> 叠在上面。
  坐标按 34 单元格居中(圆心 17),避免缩放到 34px 时偏一点点。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="102" height="34" viewBox="0 0 102 34">

  <g transform="translate(0,0)">
    <circle cx="17" cy="17" r="15" fill="#FFFFFF" stroke="#D5DAE1" stroke-width="1.5"/>
  </g>

  <g transform="translate(34,0)">
    <circle cx="17" cy="17" r="15" fill="#F2F4F6" stroke="#B6BCC5" stroke-width="1.5"/>
  </g>

  <g transform="translate(68,0)">
    <circle cx="17" cy="17" r="16" fill="#0E9F9F"/>
    <circle cx="17" cy="17" r="16" fill="none" stroke="#0E9F9F" stroke-width="1.5"/>
  </g>
</svg>