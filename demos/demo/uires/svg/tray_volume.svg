<svg xmlns="http://www.w3.org/2000/svg" width="80" height="20" viewBox="0 0 80 20">
  <!--
    托盘菜单「音量」按钮:横向 4 帧,每帧 20x20,喇叭 + 两道声波。
    帧序:0=常态 1=悬停 2=按下 3=禁用。
    配色:灰 #5F6672 → 深灰 #1F2329 → 更深灰 #101418 → 禁用 #C9CDD4
    (弹窗不参与换肤染色,统一使用中性灰)。
  -->
  <path d="M3.4,7.6 H6.6 L10,4.4 V15.6 L6.6,12.4 H3.4 Z" fill="#5F6672"/>
  <path d="M12.2,7.4 A4,4 0 0 1 12.2,12.6 M14.6,5 A7,7 0 0 1 14.6,15" stroke="#5F6672" stroke-width="1.4" fill="none"/>

  <path d="M23.4,7.6 H26.6 L30,4.4 V15.6 L26.6,12.4 H23.4 Z" fill="#1F2329"/>
  <path d="M32.2,7.4 A4,4 0 0 1 32.2,12.6 M34.6,5 A7,7 0 0 1 34.6,15" stroke="#1F2329" stroke-width="1.4" fill="none"/>

  <path d="M43.4,7.6 H46.6 L50,4.4 V15.6 L46.6,12.4 H43.4 Z" fill="#101418"/>
  <path d="M52.2,7.4 A4,4 0 0 1 52.2,12.6 M54.6,5 A7,7 0 0 1 54.6,15" stroke="#101418" stroke-width="1.4" fill="none"/>

  <path d="M63.4,7.6 H66.6 L70,4.4 V15.6 L66.6,12.4 H63.4 Z" fill="#C9CDD4"/>
  <path d="M72.2,7.4 A4,4 0 0 1 72.2,12.6 M74.6,5 A7,7 0 0 1 74.6,15" stroke="#C9CDD4" stroke-width="1.4" fill="none"/>
</svg>
