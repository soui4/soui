<?xml version="1.0" encoding="utf-8"?>
<!--
  container_bg.svg - 动态创建窗口演示页 wnd_container 容器背景(nanosvg 兼容)
  单帧 260x160,绘制时整体拉伸到容器客户区。
  视觉语言:白底 + 1px 中性灰虚线圆角框,只用"虚线"表达"这是可放置内容的容器",
  不再使用蓝色描边、四角实线角标和左上角胶囊标签——那些元素在浅色现代界面里噪声太大。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="160" viewBox="0 0 260 160">
  <!-- 容器白底,与页面的 #F7F8FA 拉开一层 -->
  <rect x="1" y="1" width="258" height="158" rx="8" fill="#FFFFFF"/>
  <!-- 1px 中性灰虚线边框:唯一的"容器"语义标识 -->
  <rect x="1" y="1" width="258" height="158" rx="8" fill="none" stroke="#D5DAE1" stroke-width="1" stroke-dasharray="6,5"/>
</svg>
