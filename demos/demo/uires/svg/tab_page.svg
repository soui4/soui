<?xml version="1.0" encoding="UTF-8"?>
<!--
  tab_page.svg - 页签示意图标(6 帧,nanosvg 兼容)
  每帧 40x40,总尺寸 240x40。原色为蓝色系,这里统一改成中性灰 + 青色强调,
  与整体色板一致(灰色描边保证在浅色底上的可读性)。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="40" viewBox="0 0 240 40">
  <defs>
    <linearGradient id="gTab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD3D3"/>
      <stop offset="1" stop-color="#0E9F9F"/>
    </linearGradient>
  </defs>

  <!-- 0:总览(四宫格) -->
  <g transform="translate(0,0)" fill="url(#gTab)">
    <rect x="7"  y="7"  width="11" height="11" rx="2.5"/>
    <rect x="22" y="7"  width="11" height="11" rx="2.5" opacity="0.6"/>
    <rect x="7"  y="22" width="11" height="11" rx="2.5" opacity="0.6"/>
    <rect x="22" y="22" width="11" height="11" rx="2.5"/>
  </g>

  <!-- 1:个人中心(单人) -->
  <g transform="translate(40,0)">
    <circle cx="20" cy="15" r="6.5" fill="url(#gTab)"/>
    <path d="M8,33 C8,24.5 13.5,21 20,21 C26.5,21 32,24.5 32,33 Z" fill="url(#gTab)" opacity="0.75"/>
  </g>

  <!-- 2:消息(对话气泡) -->
  <g transform="translate(80,0)">
    <path d="M8,11 C8,8.8 9.8,7 12,7 L28,7 C30.2,7 32,8.8 32,11 L32,24 C32,26.2 30.2,28 28,28 L17,28 L10.5,33 L11.5,28 L12,28 C9.8,28 8,26.2 8,24 Z"
          fill="url(#gTab)"/>
  </g>

  <!-- 3:数据统计(柱状) -->
  <g transform="translate(120,0)" fill="url(#gTab)">
    <rect x="7"  y="24" width="6" height="9"  rx="2"/>
    <rect x="17" y="15" width="6" height="18" rx="2"/>
    <rect x="27" y="9"  width="6" height="24" rx="2" opacity="0.75"/>
  </g>

  <!-- 4:邮件订阅(信封) -->
  <g transform="translate(160,0)">
    <rect x="7" y="10" width="26" height="20" rx="3" fill="url(#gTab)" opacity="0.85"/>
    <path d="M8.5,12.5 L20,21 L31.5,12.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 5:收藏关注(星标) -->
  <g transform="translate(200,0)">
    <path d="M20,7 L23.7,15.2 L32.5,16.2 L26,22.1 L27.8,30.8 L20,26.4 L12.2,30.8 L14,22.1 L7.5,16.2 L16.3,15.2 Z"
          fill="url(#gTab)"/>
  </g>
</svg>