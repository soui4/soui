          <circle cx="22" cy="17" r="5.5"/>
    <path d="M12,34 C12,27 16.5,24 22,24 C27.5,24 32,27 32,34"/>
    </g>
  </g>
  <g transform="translate(44,0)">
    <rect x="0" y="0" width="44" height="44" fill="#FFFFFF"/>
    <g stroke="#3F4650" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="22" cy="17" r="5.5"/>
    <path d="M12,34 C12,27 16.5,24 22,24 C27.5,24 32,27 32,34"/>
    </g>
  </g>
  <g transform="translate(88,0)">
    <rect x="0" y="0" width="44" height="44" fill="#FFFFFF"/>
    <circle cx="22" cy="22" r="21" fill="#0E9F9F"/>
    <g stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="22" cy="17" r="5.5"/>
    <path d="M12,34 C12,27 16.5,24 22,24 C27.5,24 32,27 32,34"/>
    </g>
  </g>
</svg>