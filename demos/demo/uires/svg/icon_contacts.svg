<?xml version="1.0" encoding="UTF-8"?>
<!--
  icon_contacts.svg - 图标型单选 icon_contacts (3 态,nanosvg 兼容)
  每帧 44x44,总尺寸 132x44。
  imglist 默认 checkAsPushdown=true:0=normal(灰线) 1=hover(深灰线) 2=checked(青色实底)。
  画布不透明填充卡片白,避免分层窗口下边缘半透明像素被按预乘 alpha 解释而发灰。
-->
