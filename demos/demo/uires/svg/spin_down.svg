<?xml version="1.0" encoding="UTF-8"?>
<!--
  spin_down.svg - spinButton 的下箭头 3 态精灵(nanosvg 兼容)
  每帧 16x15,总尺寸 48x15;帧序 0=normal 1=hover 2=pushdown。
  与 spin_up.svg 成对使用,造型镜像、配色一致,解决内置位图箭头在高 DPI 下的锯齿。
  用法:values/skin.xml 的 skin_spin_down;spinButton 属性 downskin="skin_spin_down"。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="15" viewBox="0 0 48 15">

  <!-- 帧0 常态 -->
  <g transform="translate(0,0)">
    <path d="M4,5.5 L8,9.5 L12,5.5" fill="none" stroke="#9AA1AC" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 帧1 悬停 -->
  <g transform="translate(16,0)">
    <path d="M4,5.5 L8,9.5 L12,5.5" fill="none" stroke="#6B7280" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 帧2 按下 -->
  <g transform="translate(32,0)">
    <path d="M4,5.5 L8,9.5 L12,5.5" fill="none" stroke="#4B5563" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
