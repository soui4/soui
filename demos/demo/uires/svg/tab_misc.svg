<svg xmlns="http://www.w3.org/2000/svg" width="176" height="16" viewBox="0 0 220 20">
  <!-- 杂项分区页签图标:11 帧横排,20x20 网格,渲染到 16x16。
       笔画规格与 ctrl_icons 一致:主描边 1.4~1.5px、辅助线 1.3px、强调色用低透明填充。 -->
  <!-- frame 0: script(</> 代码符号) -->
  <path d="M7 6L3 10l4 4M13 6l4 4-4 4M11.5 4l-3 12" stroke="#6B7280" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- frame 1: drag drop(托盘 + 向下箭头) -->
  <path d="M22 13v4h16v-4" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 3v9M27 9l3 3 3-3" fill="none" stroke="#B6BCC5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- frame 2: animation(胶片框) -->
  <rect x="42" y="5" width="16" height="10" rx="2" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <path d="M47.5 7.8l4.5 2.2-4.5 2.2z" fill="#6B7280" fill-opacity="0.8"/>
  <path d="M42 17h16" stroke="#B6BCC5" stroke-width="1.3" stroke-dasharray="2.5 2"/>
  <!-- frame 3: iectrl(地球:经线 + 纬线) -->
  <circle cx="70" cy="10" r="7" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <ellipse cx="70" cy="10" rx="3.1" ry="7" fill="none" stroke="#B6BCC5" stroke-width="1.3"/>
  <path d="M63 10h14M64.5 6h11M64.5 14h11" stroke="#B6BCC5" stroke-width="1.3"/>
  <!-- frame 4: create window(窗体 + 加号) -->
  <rect x="82" y="4" width="14" height="11" rx="1.5" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <path d="M82 8h14" stroke="#6B7280" stroke-width="1.5"/>
  <path d="M98 12v7M94.5 15.5h7" stroke="#B6BCC5" stroke-width="1.4" stroke-linecap="round"/>
  <!-- frame 5: apple dock(底部托盘 + 图标) -->
  <rect x="102" y="14" width="16" height="4" rx="2" fill="none" stroke="#B6BCC5" stroke-width="1.3"/>
  <circle cx="106" cy="16" r="1" fill="#6B7280"/>
  <circle cx="110" cy="16" r="1" fill="#6B7280"/>
  <circle cx="114" cy="16" r="1" fill="#6B7280"/>
  <circle cx="110" cy="7" r="2.4" fill="#6B7280" fill-opacity="0.3"/>
  <!-- frame 6: SetWindowRgn(虚线裁切圆 + 星形) -->
  <circle cx="130" cy="10" r="7.2" fill="none" stroke="#B6BCC5" stroke-width="1.3" stroke-dasharray="3 2"/>
  <path d="M130 4.6l1.55 3.1 3.4.5-2.45 2.4.6 3.4-3.1-1.65-3.1 1.65.6-3.4-2.45-2.4 3.4-.5z" fill="#6B7280" fill-opacity="0.75"/>
  <!-- frame 7: transform(旋转箭头) -->
  <path d="M156 5a6.4 6.4 0 1 0 3.4 8.8" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M157.6 3.2l2.9 3.3-4.3 1z" fill="#6B7280"/>
  <!-- frame 8: free move(四向箭头) -->
  <path d="M170 5v10M165 10h10" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M170 2.4l-1.8 2.6h3.6zM170 17.6l-1.8-2.6h3.6zM162.4 10l2.6-1.8v3.6zM177.6 10l-2.6-1.8v3.6z" fill="#6B7280"/>
  <!-- frame 9: svg(贝塞尔曲线 + 锚点) -->
  <path d="M184 14c2.5-6.8 9.5-6.8 12 0" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="184" cy="14" r="1.5" fill="#B6BCC5"/>
  <circle cx="196" cy="14" r="1.5" fill="#B6BCC5"/>
  <path d="M186 5.5h8" stroke="#B6BCC5" stroke-width="1.3" stroke-dasharray="2 1.5"/>
  <!-- frame 10: webp(文件轮廓 + W 标) -->
  <path d="M202 4h3.5l2 2H216a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-14a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M203 12.5l2.2-4 1.4 2 1.4-2 2.2 4" fill="none" stroke="#B6BCC5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
