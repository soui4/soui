<?xml version="1.0" encoding="utf-8"?>
<!--
  旋钮表盘:横向 2 帧(帧0 = 正常/悬停/按下,帧1 = 禁用),每帧 62x62,由 SImageKnob 按 value 旋转。

  分工(关键):
    - 外圈的灰色轨道 + 青色进度弧全部由 SImageKnob 内置弧尺(GDI Arc)绘制,
      弧尺线宽固定 10px、画在"客户区四边内缩 5"的圆上,即 62x62 里形成 21~31 的环带。
      两条弧用同一支画笔、同一矩形,几何天然对齐,不会出现内外圈错位。
    - 本 svg 只画"白色盘面"和指针:
        盘面 r=19(比环带内边 21 再内收 2,留出细白缝,视觉上盘面与圆环分离);
        指针 = 盘面内的圆角竖条(径向 6~15),画在正上方,随 value 旋转到对应角度;
        放在盘面内部而不是环带上,避免与进度弧端头重叠成一坨。
  说明:早先把灰色轨道也画进 svg,但 svg 的实际绘制尺寸与 GDI 弧尺的像素几何不一致,
        进度弧会偏到轨道内侧;现在轨道交回控件绘制,彻底消除错位。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="124" height="62" viewBox="0 0 124 62">
  <!-- 帧0 正常:白色盘面 + 盘面内的圆角青色指针 -->
  <circle cx="31" cy="31" r="19" fill="#FFFFFF" stroke="#E8EAED" stroke-width="1.5"/>
  <rect x="28.5" y="16" width="5" height="9" rx="2.5" fill="#0E9F9F"/>

  <!-- 帧1 禁用:盘面描边与指针降为浅灰 -->
  <circle cx="93" cy="31" r="19" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.5"/>
  <rect x="90.5" y="16" width="5" height="9" rx="2.5" fill="#C9CDD4"/>
</svg>
