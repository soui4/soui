<svg xmlns="http://www.w3.org/2000/svg" width="96" height="24" viewBox="0 0 96 24">
  <!--
    托盘菜单「播放」按钮:横向 4 帧,每帧 24x24(略大于其它按钮,作为主操作强调)。
    帧序:0=常态 1=悬停 2=按下 3=禁用。
    配色:深灰 #1F2329 → 黑 #000000 → 黑 #000000 → 禁用 #C9CDD4。
    说明:托盘菜单是独立 popup 窗口,不参与换肤染色,所以主操作强调改用"最深的中性色"
    而不是主题青,保证任何主题下都是视觉焦点且不冲突。
  -->
  <path d="M7,4 L19,12 L7,20 Z" fill="#1F2329"/>
  <path d="M31,4 L43,12 L31,20 Z" fill="#000000"/>
  <path d="M55,4 L67,12 L55,20 Z" fill="#000000"/>
  <path d="M79,4 L91,12 L79,20 Z" fill="#C9CDD4"/>
</svg>
