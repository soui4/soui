<?xml version="1.0" encoding="UTF-8"?>
<!--
  btn_skin.svg - 标题栏"换肤"按钮图标(nanosvg 兼容)
  3 帧横排,每帧 20x20,总尺寸 60x20。
  帧序与 SOUI imgbtn 三态约定一致:0=normal  1=hover  2=push
  图形:调色板(换肤),三态用不同亮度区分。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="20" viewBox="0 0 60 20">
  <!-- 帧0:normal #64748B -->
  <g transform="translate(0,0)">
    <path d="M10,2.5 C5.3,2.5 1.8,6 1.8,10.3 C1.8,14.6 5.2,17.5 8.6,17.5 C10.4,17.5 11.2,16.5 11.2,15.3 C11.2,14.4 10.6,13.9 10.6,13 C10.6,11.9 11.5,11.2 12.7,11.2 L14.4,11.2 C16.2,11.2 18.2,10.2 18.2,7.3 C18.2,4.5 14.7,2.5 10,2.5 Z" fill="none" stroke="#64748B" stroke-width="1.6"/>
    <circle cx="6.5" cy="7.5" r="1.3" fill="#64748B"/>
    <circle cx="10.2" cy="5.8" r="1.3" fill="#64748B"/>
    <circle cx="14" cy="7.2" r="1.3" fill="#64748B"/>
    <circle cx="5.8" cy="11.5" r="1.3" fill="#64748B"/>
  </g>
  <!-- 帧1:hover #2563EB -->
  <g transform="translate(20,0)">
    <path d="M10,2.5 C5.3,2.5 1.8,6 1.8,10.3 C1.8,14.6 5.2,17.5 8.6,17.5 C10.4,17.5 11.2,16.5 11.2,15.3 C11.2,14.4 10.6,13.9 10.6,13 C10.6,11.9 11.5,11.2 12.7,11.2 L14.4,11.2 C16.2,11.2 18.2,10.2 18.2,7.3 C18.2,4.5 14.7,2.5 10,2.5 Z" fill="none" stroke="#2563EB" stroke-width="1.6"/>
    <circle cx="6.5" cy="7.5" r="1.3" fill="#2563EB"/>
    <circle cx="10.2" cy="5.8" r="1.3" fill="#2563EB"/>
    <circle cx="14" cy="7.2" r="1.3" fill="#2563EB"/>
    <circle cx="5.8" cy="11.5" r="1.3" fill="#2563EB"/>
  </g>
  <!-- 帧2:push #1D4ED8 -->
  <g transform="translate(40,0)">
    <path d="M10,2.5 C5.3,2.5 1.8,6 1.8,10.3 C1.8,14.6 5.2,17.5 8.6,17.5 C10.4,17.5 11.2,16.5 11.2,15.3 C11.2,14.4 10.6,13.9 10.6,13 C10.6,11.9 11.5,11.2 12.7,11.2 L14.4,11.2 C16.2,11.2 18.2,10.2 18.2,7.3 C18.2,4.5 14.7,2.5 10,2.5 Z" fill="#1D4ED8"/>
    <circle cx="6.5" cy="7.5" r="1.3" fill="#FFFFFF"/>
    <circle cx="10.2" cy="5.8" r="1.3" fill="#FFFFFF"/>
    <circle cx="14" cy="7.2" r="1.3" fill="#FFFFFF"/>
    <circle cx="5.8" cy="11.5" r="1.3" fill="#FFFFFF"/>
  </g>
