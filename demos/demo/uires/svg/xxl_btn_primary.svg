<?xml version="1.0" encoding="UTF-8"?>
<!--
  xxl_btn_primary.svg - 消消乐主操作按钮底(药丸形,实底蓝)
  3 帧横排,每帧 100x40,总尺寸 300x40,按按钮实际尺寸九宫拉伸。
  帧序与 SOUI button 三态约定一致:0=normal  1=hover  2=push
-->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="40" viewBox="0 0 300 40">
  <!-- 帧0:normal #2563EB -->
  <rect x="0.5" y="0.5" width="99" height="39" rx="19" fill="#2563EB"/>
  <!-- 帧1:hover #3B82F6 -->
  <rect x="100.5" y="0.5" width="99" height="39" rx="19" fill="#3B82F6"/>
  <!-- 帧2:push #1D4ED8 -->
  <rect x="200.5" y="0.5" width="99" height="39" rx="19" fill="#1D4ED8"/>
</svg>
