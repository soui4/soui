<svg xmlns="http://www.w3.org/2000/svg" width="96" height="16" viewBox="0 0 120 20">
  <!-- 左侧页签图标雪碧图:6 帧横排,20x20 网格,渲染到 16x16。
       笔画规格与 ctrl_icons 对齐:主描边 1.5px、辅助线 1.3px、强调色一律用低透明填充,
       不再画 3px 粗实心条或 7x7 实心方块(那种画法在 16px 下只剩"笨重"的色块)。 -->
  <!-- frame 0: soui layout(绝对定位基准:十字准星) -->
  <circle cx="10" cy="10" r="4" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="10" cy="10" r="1.3" fill="#6B7280"/>
  <path d="M10 2.6v2.5M10 14.9v2.5M2.6 10h2.5M14.9 10h2.5" stroke="#B6BCC5" stroke-width="1.3" stroke-linecap="round"/>
  <!-- frame 1: linear layout(三行横条) -->
  <rect x="20" y="4.2" width="20" height="2.4" rx="1.2" fill="#6B7280" fill-opacity="0.55"/>
  <rect x="20" y="8.8" width="13" height="2.4" rx="1.2" fill="#6B7280" fill-opacity="0.22"/>
  <rect x="20" y="13.4" width="20" height="2.4" rx="1.2" fill="#6B7280" fill-opacity="0.55"/>
  <!-- frame 2: grid layout(2x2 网格) -->
  <rect x="42" y="3" width="7" height="7" rx="1.4" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="51" y="3" width="7" height="7" rx="1.4" fill="#6B7280" fill-opacity="0.2"/>
  <rect x="42" y="12" width="7" height="7" rx="1.4" fill="#6B7280" fill-opacity="0.2"/>
  <rect x="51" y="12" width="7" height="7" rx="1.4" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <!-- frame 3: template(虚线外框 + 内容块) -->
  <rect x="61" y="3" width="18" height="14" rx="2" fill="none" stroke="#B6BCC5" stroke-width="1.4" stroke-dasharray="3 2"/>
  <rect x="66" y="6" width="8" height="8" rx="1.2" fill="#6B7280" fill-opacity="0.3"/>
  <!-- frame 4: frame layout(四周停靠条 + 主视图) -->
  <rect x="81" y="3" width="18" height="14" rx="2" fill="none" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="83" y="5" width="14" height="2.6" rx="0.8" fill="#6B7280" fill-opacity="0.35"/>
  <rect x="83" y="9.6" width="4" height="5.4" rx="0.8" fill="#B6BCC5" fill-opacity="0.3"/>
  <rect x="89" y="9.6" width="8" height="5.4" rx="0.8" fill="#B6BCC5" fill-opacity="0.18"/>
  <!-- frame 5: flow layout(交错排布的小块) -->
  <rect x="101" y="5" width="4" height="4" rx="1.2" fill="none" stroke="#6B7280" stroke-width="1.4"/>
  <rect x="107" y="5" width="4" height="4" rx="1.2" fill="#6B7280" fill-opacity="0.2"/>
  <rect x="113" y="5" width="4" height="4" rx="1.2" fill="none" stroke="#6B7280" stroke-width="1.4"/>
  <rect x="101" y="11" width="4" height="4" rx="1.2" fill="#6B7280" fill-opacity="0.2"/>
  <rect x="107" y="11" width="4" height="4" rx="1.2" fill="none" stroke="#6B7280" stroke-width="1.4"/>
</svg>
