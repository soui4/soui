plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soui.fundholdings'
    compileSdk 34

    defaultConfig {
        applicationId "com.soui.fundholdings"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                // native 由本 app 通过 soui4_android.cmake 统一编译：
                //   SOUI_ROOT_DIR           仓库根目录
                //   SOUI_ANDROID_LIB_CPP_DIR soui-android-lib 的 native 源码与头文件
                //   SOUI_CONTROLS_EXTEND_DIR 扩展控件目录（编译 gridctrl）
                //   FUNDHOLDINGS_DIR         本 demo 的共享业务源码目录
                //   SOUI_BUILD_HTTPCLIENT=ON 基金数据抓取依赖 IHttpClient（非 Windows 走 libcurl）
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared",
                        "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
                        "-DSOUI_ROOT_DIR=${rootDir.absolutePath.replace('\\', '/')}/../../..",
                        "-DSOUI_ANDROID_LIB_CPP_DIR=${project(':soui-android-lib').projectDir.absolutePath.replace('\\', '/')}/src/main/cpp",
                        "-DSOUI_CONTROLS_EXTEND_DIR=${rootDir.absolutePath.replace('\\', '/')}/../../../controls.extend",
                        "-DFUNDHOLDINGS_DIR=${rootDir.absolutePath.replace('\\', '/')}/..",
                        "-DSOUI_BUILD_HTTPCLIENT=ON",
                        // components 默认全量编译，移动端按需显式挑选要关闭的组件。
                        // 基金持仓 app 不需要的组件在此关闭，APK 不再包含以下 .so：
                        //   libws.so / libnetwork.so / libresprovider-zip.so /
                        //   libscriptmodule-lua.so / libtranslator.so / libsipcobject.so
                        "-DSOUI_BUILD_WS=OFF",
                        "-DSOUI_BUILD_NETWORK=OFF",
                        "-DSOUI_BUILD_RES_ZIP=OFF",
                        "-DSOUI_BUILD_SCRIPT_LUA=OFF",
                        "-DSOUI_BUILD_TRANSLATOR=OFF",
                        "-DSOUI_BUILD_RES_IPC=OFF"
            }
        }
        ndk {
            abiFilters 'x86', 'arm64-v8a', 'x86_64', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug

        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.18.1"
        }
    }

    // 移动版 uires 直接以 assets 源目录的方式随 APK 打包，避免在 android/ 下维护副本：
    //   ../../mobile/uires  ->  assets/uires（SetAppResAndroidAsset 读取）
    //   src/main/assets/soui_sys_res -> assets/soui_sys_res（系统资源皮肤）
    // 注意：srcDirs 相对本模块目录（app/），不是仓库或工程根目录。
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../mobile']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 引用 soui-android-lib 模块
    implementation project(':soui-android-lib')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
